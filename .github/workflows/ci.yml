name: CI

on:
  pull_request:
    branches: [main, dev]
  # PR runs can only restore caches saved on their base branch
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in step with REQUIRED_FLUTTER_VERSION in Build.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

