name: Android build

# Separate from CI so pure Dart changes skip the ~7 minute native compile.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'
  # Every push to dev builds, as a safety net and to keep the caches warm
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      phone_test:
        description: Build a separate Beacon Telemetry app beside the installed Beacon app
        type: boolean
        default: false
      upload_artifact:
        description: Upload the APK (disable when account artifact storage is unavailable)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    env:
      BEACON_TELEMETRY_TEST_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.phone_test && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'  # maplibre_gl compiles with --release 21
          cache: gradle

      # Keep in step with REQUIRED_FLUTTER_VERSION in Build.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Test Android telemetry service
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests meshcorebeacon.app.TelemetryServiceTest
      - name: Record phone test build
        if: github.event_name == 'workflow_dispatch' && inputs.phone_test
        run: |
          git rev-parse HEAD > build/app/outputs/flutter-apk/commit.txt
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk > SHA256SUMS
      - name: Upload phone test APK
        if: github.event_name == 'workflow_dispatch' && inputs.phone_test && inputs.upload_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beacon-telemetry-phone-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/commit.txt
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
